<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Kamao</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <div class="brand"><span class="coin">K</span> Kamao Admin</div>
    <div class="user-chip">
      <span id="adminEmail"></span> &nbsp;·&nbsp;
      <a href="#" id="logoutBtn">Logout</a>
    </div>
  </div>

  <div id="notAdminMsg" class="card" style="display:none; text-align:center; padding:40px;">
    Ye page sirf admin ke liye hai.
  </div>

  <div id="adminContent" style="display:none">
    <div class="section-title">Pending Withdrawal Requests</div>
    <div class="card">
      <table>
        <thead>
          <tr><th>Date</th><th>User</th><th>Amount</th><th>Net to Pay</th><th>Method</th><th>Details</th><th>Referral Commission</th><th>Action</th></tr>
        </thead>
        <tbody id="pendingBody"></tbody>
      </table>
      <div class="empty" id="pendingEmpty" style="display:none">Koi pending request nahi hai.</div>
    </div>

    <div class="section-title">Paid History</div>
    <div class="card">
      <table>
        <thead>
          <tr><th>Date</th><th>User</th><th>Amount</th><th>Method</th></tr>
        </thead>
        <tbody id="paidBody"></tbody>
      </table>
      <div class="empty" id="paidEmpty" style="display:none">Abhi tak koi paid record nahi.</div>
    </div>
  </div>
</div>

<script type="module" src="js/admin.js"></script>
</body>
</html>
